<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parat Dar Parat v2 — frames</title>
<link rel="stylesheet" href="../assets/frame.css">
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script>
<style>
  html,body,.stage{width:100vw;height:100vh}
  body{background:#0b0807}
  .tag{position:absolute;font:400 11px/1 var(--font-sans);letter-spacing:.32em;text-transform:uppercase;color:var(--linen);white-space:nowrap;text-shadow:0 1px 8px #000;padding-left:16px}
  .tag::before{content:'';position:absolute;left:0;top:-1px;width:7px;height:7px;border:1px solid var(--gold);border-radius:50%}
  .tag span{display:block;margin-top:7px;font:italic 300 13px/1 var(--font-sans);letter-spacing:.04em;text-transform:none;color:var(--blush)}
  .side{position:absolute;left:96px;top:50%;transform:translateY(-50%);width:360px;color:var(--linen)}
  .side .kicker{font:400 12px/1 var(--font-sans);letter-spacing:.42em;text-transform:uppercase;opacity:.7}
  .side .say{font:300 36px/1.3 var(--font-sans);margin-top:20px}
  .side .say em{font-family:var(--font-display);font-style:normal}
  .side .sub{font:300 15px/1.7 var(--font-sans);color:var(--taupe);margin-top:22px;max-width:300px}
  .cta{display:inline-block;margin-top:34px;padding:16px 28px;background:var(--maroon);color:var(--on-maroon);font:400 12px/1 var(--font-sans);letter-spacing:.3em;padding-left:calc(28px + .3em);text-transform:uppercase;border:1px solid rgba(201,165,107,.6)}
  .cue{position:absolute;right:96px;top:50%;transform:translateY(-50%);font:400 11px/1 var(--font-sans);letter-spacing:.4em;text-transform:uppercase;color:rgba(242,233,225,.5);writing-mode:vertical-rl}
  .cue::after{content:'';display:inline-block;width:1px;height:70px;margin-top:18px;background:linear-gradient(var(--gold),transparent)}
  @media (max-width:800px){
    .side{left:24px;right:24px;width:auto;top:auto;bottom:64px;transform:none;text-align:center;z-index:2}
    .side .say{font-size:26px}
    .side::before{content:'';position:absolute;left:-24px;right:-24px;top:-60px;bottom:-90px;z-index:-1;background:linear-gradient(transparent,rgba(8,5,4,.88) 45%)}
    .cue{display:none}
    .slate{left:24px;bottom:22px;font-size:9px;letter-spacing:.2em}
    .scrub{display:none}
  }
</style></head>
<body><div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="vignette"></div><div class="grain"></div>
  <div class="side" id="side"></div>
  <div class="slate" id="slate"></div>
  <div class="scrub"><i id="scrub"></i></div>
</div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { C, canvas, rng, archPath, skyline, garlands, filigree, loadImage } from '../assets/art.js';

const shot = +(new URLSearchParams(location.search).get('shot') || 1);
const VW = innerWidth, VH = innerHeight, mobile = VW < 800;
await Promise.all(['118px "Pinyon Script"', '44px "Tiro Devanagari Hindi"', '300 30px Jost', '400 30px Jost', '40px "Gilda Display"'].map(f => document.fonts.load(f)));
const emblem = await loadImage('../assets/logos/a-emblem-gold.png');

// ---------------------------------------------------------------------------
// Copy for each shot (all on-screen words live here).
// ---------------------------------------------------------------------------
const COPY = {
  1: { kicker: 'Aamantran Atelier', say: 'This is <em>one second</em><br>of an invitation.', slate: 'shot 1 · the opening frame looks flat', scrub: 4, cue: true },
  2: { kicker: 'Parat dar parat', say: 'It was <em>never flat.</em>', sub: 'Every second is built from dozens of hand-made layers, set in depth. Move, and it comes apart.', slate: 'shot 2 · the camera moves; nothing else does', scrub: 18 },
  3: { kicker: 'Behind every layer', say: 'It begins with<br><em>a conversation.</em>', sub: 'What you tell us on the discovery call becomes the invitation, detail by detail.', slate: 'shot 4 · behind the stack: the discovery-call notes', scrub: 34 },
  4: { kicker: 'Aamantran Atelier', say: 'Made to be seen<br>from one place.<br><em>Yours.</em>', cta: 'Request the lookbook', slate: 'shot 9 · the layers lock; the film plays; the reply', scrub: 96 },
}[shot];
document.getElementById('side').innerHTML = `<div class="kicker">${COPY.kicker}</div><div class="say">${COPY.say}</div>` +
  (COPY.sub ? `<div class="sub">${COPY.sub}</div>` : '') + (COPY.cta ? `<a class="cta">${COPY.cta}</a>` : '');
document.getElementById('slate').innerHTML = `<b>A · Parat Dar Parat v2</b> &nbsp;—&nbsp; ${COPY.slate}`;
document.getElementById('scrub').style.width = COPY.scrub + '%';
if (COPY.cue) document.getElementById('stage').insertAdjacentHTML('beforeend', '<div class="cue">Scroll</div>');

// ---------------------------------------------------------------------------
// The invitation's layers, each drawn on its own transparent canvas (900 x 1600).
// Stand-in art: the real build uses the layered source of a real invite.
// ---------------------------------------------------------------------------
const W = 900, H = 1600, r = rng(5);
const layers = [];
const addLayer = (key, label, note, z, draw, opts = {}) => { const [c, g] = canvas(W, H); draw(g); layers.push({ key, label, note, z, c, ...opts }); };

addLayer('sky', 'Sky', 'her mother’s maroon saree', -9.5, g => {
  const s = g.createLinearGradient(0, 0, 0, H); s.addColorStop(0, '#1e080a'); s.addColorStop(.55, '#5C1A1B'); s.addColorStop(1, '#a8625f');
  g.fillStyle = s; g.fillRect(0, 0, W, H);
  g.fillStyle = '#F2E9E1'; for (let i = 0; i < 140; i++) { g.globalAlpha = r() * .8; g.beginPath(); g.arc(r() * W, r() * H * .55, r() * 1.8, 0, 7); g.fill(); }
  g.globalAlpha = 1; const m = g.createRadialGradient(W * .7, H * .17, 30, W * .7, H * .17, 120); m.addColorStop(0, '#fff6e8'); m.addColorStop(.4, 'rgba(255,240,220,.9)'); m.addColorStop(.42, 'rgba(255,220,180,.12)'); m.addColorStop(1, 'rgba(255,220,180,0)');
  g.fillStyle = m; g.fillRect(0, 0, W, H);
});
addLayer('arch', 'Architecture', 'Nani’s Jaipur', -7.6, g => { g.fillStyle = '#34100f'; skyline(g, W, H * .7, 74, 3); g.fillStyle = 'rgba(255,190,110,.75)'; for (let i = 0; i < 26; i++) g.fillRect(r() * W, H * .66 + r() * H * .1, 4, 7); });
addLayer('frame', 'Arch frame', 'Mughal cusped arch', -5.9, g => {
  g.fillStyle = C.green; g.beginPath(); g.rect(0, 0, W, H); archPath(g, 100, H - 80, W - 200, H * .8); g.fill('evenodd');
  g.strokeStyle = C.gold; g.lineWidth = 4; g.beginPath(); archPath(g, 100, H - 80, W - 200, H * .8); g.stroke();
  g.lineWidth = 1.5; g.beginPath(); archPath(g, 118, H - 98, W - 236, H * .78); g.stroke();
});
addLayer('florals', 'Florals', 'her marigolds', -4.3, g => garlands(g, W, H, 11));
addLayer('music', 'Music', 'their song, 0:42', -3.1, g => {
  g.strokeStyle = 'rgba(201,165,107,.9)'; g.lineWidth = 2; const y0 = H * .87;
  for (let x = 160; x < W - 160; x += 7) { const a = (Math.sin(x * .05) * .5 + .5) * (Math.sin(x * .013 + 1) * .5 + .5) * 46 + 4; g.beginPath(); g.moveTo(x, y0 - a); g.lineTo(x, y0 + a); g.stroke(); }
}, { emissive: 1.4 });
addLayer('hindi', 'Devanagari', 'शुभ विवाह', -2.1, g => { g.textAlign = 'center'; g.font = '46px "Tiro Devanagari Hindi"'; g.fillStyle = C.gold; g.fillText('शुभ विवाह', W / 2, H * .37); });
addLayer('names', 'Calligraphy', 'in Dadi’s hand', -1.1, g => {
  g.textAlign = 'center'; g.font = '124px "Pinyon Script"'; g.fillStyle = C.linen; g.fillText('Ananya & Kabir', W / 2, H * .465);
  g.font = '300 30px Jost'; g.letterSpacing = '9px'; g.fillStyle = C.blush; g.fillText('14 · 02 · 2027', W / 2, H * .525);
  g.font = '300 22px Jost'; g.letterSpacing = '7px'; g.fillText('JAIPUR', W / 2, H * .56);
});
addLayer('gold', 'Gold foil', 'engraved by hand', 0, g => filigree(g, W, H, 44), { emissive: 1.5 });
addLayer('light', 'Light', 'lamp glow, animated', 1.3, g => {
  const l = g.createRadialGradient(W / 2, H * .47, 10, W / 2, H * .47, W * .62); l.addColorStop(0, 'rgba(255,196,120,.24)'); l.addColorStop(1, 'rgba(255,196,120,0)'); g.fillStyle = l; g.fillRect(0, 0, W, H);
}, { additive: true });
addLayer('dust', 'Particles', '4,000 motes of gold', 2.5, g => {
  for (let i = 0; i < 380; i++) { g.fillStyle = `rgba(240,205,140,${r()})`; g.beginPath(); g.arc(r() * W, r() * H, r() * 2.6 + .4, 0, 7); g.fill(); }
}, { additive: true });

// ---------------------------------------------------------------------------
// Scene. The trick: layers sit at different depths but are scaled so that from ONE
// camera position (the "alignment point") they line up into a single flat picture.
// Any camera move breaks the picture apart; returning re-locks it.
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(VW, VH, false); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#0b0807');
const D = 12, PW = 2.25, PH = 4;                       // alignment distance, reference plane size
const aspect = VW / VH;
// Desktop: invite fills 86% of height. Phone: invite covers the whole screen (it is phone-shaped).
const visibleH = mobile ? Math.min(PH, PW / aspect) : PH / .86;
const camera = new THREE.PerspectiveCamera(2 * Math.atan(visibleH / 2 / D) * 180 / Math.PI, aspect, .05, 200);
const tex = c => { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };

const meshes = {};
for (const L of layers) {
  const s = (D - L.z) / D;
  const mat = new THREE.MeshBasicMaterial({ map: tex(L.c), transparent: true, side: THREE.DoubleSide, depthWrite: !L.additive,
    blending: L.additive ? THREE.AdditiveBlending : THREE.NormalBlending });
  if (L.emissive) mat.color.setScalar(L.emissive);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(PW * s, PH * s), mat);
  m.position.z = L.z; m.userData = L; scene.add(m); meshes[L.key] = m;
  if (shot === 2 || shot === 3) {
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: '#C9A56B', transparent: true, opacity: .28 }));
    m.add(e);
  }
}

// The discovery-call notes: a linen sheet behind the stack, facing backwards, only seen when the camera goes round.
const NOTES = [
  ['Nani grew up near the chhatris, Jaipur', 'arch', [.5, .66]],
  ['Her mother’s maroon saree — that colour', 'sky', [.25, .35]],
  ['Marigolds. Lots of marigolds.', 'florals', [.3, .12]],
  ['Their song: the sitar version, 0:42', 'music', [.5, .87]],
  ['Names in Dadi’s handwriting', 'names', [.42, .465]],
];
{
  const [c, g] = canvas(1100, 1400);
  g.fillStyle = '#efe4d6'; g.fillRect(0, 0, 1100, 1400);
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(90,70,54,${r() * .06})`; g.fillRect(r() * 1100, r() * 1400, 2, 2); }
  g.strokeStyle = 'rgba(122,92,46,.25)'; g.lineWidth = 1; for (let y = 260; y < 1340; y += 72) { g.beginPath(); g.moveTo(80, y); g.lineTo(1020, y); g.stroke(); }
  g.fillStyle = C.ink; g.font = '40px "Gilda Display"'; g.letterSpacing = '6px'; g.fillText('DISCOVERY CALL', 80, 130);
  g.font = '300 24px Jost'; g.letterSpacing = '4px'; g.fillStyle = C.cocoa; g.fillText('ANANYA & KABIR  ·  12 · 03 · 2026', 80, 180);
  g.letterSpacing = '0px';
  NOTES.forEach(([t], i) => {
    const y = 300 + i * 216; g.fillStyle = C.goldDeep; g.font = '400 22px Jost'; g.fillText(String(i + 1).padStart(2, '0'), 80, y);
    g.fillStyle = C.ink; g.font = 'italic 300 44px Jost'; g.fillText(t, 140, y + 2);
    g.strokeStyle = 'rgba(122,31,38,.55)'; g.lineWidth = 2.4; g.beginPath(); g.moveTo(140, y + 22); for (let x = 140; x < 140 + g.measureText(t).width * .55; x += 12) g.lineTo(x, y + 20 + Math.sin(x * .2) * 2); g.stroke();
  });
  g.save(); g.translate(880, 1240); g.rotate(-.2); g.strokeStyle = 'rgba(122,31,38,.6)'; g.lineWidth = 3; g.beginPath(); g.ellipse(0, 0, 120, 50, 0, 0, 7); g.stroke();
  g.font = 'italic 300 30px Jost'; g.fillStyle = 'rgba(122,31,38,.85)'; g.textAlign = 'center'; g.fillText('moodboard → Fri', 0, 10); g.restore();
  const notes = new THREE.Mesh(new THREE.PlaneGeometry(3.3, 4.2), new THREE.MeshBasicMaterial({ map: tex(c), color: new THREE.Color(.82, .8, .78) }));
  notes.position.set(-3.6, .7, -13.4); notes.rotation.y = Math.PI - .55; notes.rotation.z = .03; scene.add(notes); meshes.notes = notes;
  notes.updateMatrixWorld();
}

scene.add(new THREE.AmbientLight('#fff', 1));
const dg = new THREE.BufferGeometry(), dp = [];
for (let i = 0; i < 1400; i++) dp.push((r() - .5) * 30, (r() - .5) * 16, 6 - r() * 28);
dg.setAttribute('position', new THREE.Float32BufferAttribute(dp, 3));
scene.add(new THREE.Points(dg, new THREE.PointsMaterial({ color: '#e8c48c', size: .025, transparent: true, opacity: .55 })));

const pivot = new THREE.Vector3(0, 0, -4.5);
function orbit(deg, elev, dist, lookOffset = new THREE.Vector3()) {
  const a = deg * Math.PI / 180, e = elev * Math.PI / 180;
  camera.position.set(Math.sin(a) * Math.cos(e) * dist, Math.sin(e) * dist, Math.cos(a) * Math.cos(e) * dist).add(pivot);
  camera.lookAt(pivot.clone().add(lookOffset));
}
const stage = document.getElementById('stage');
const toScreen = v => { const p = v.clone().project(camera); return [(p.x + 1) / 2 * VW, (1 - p.y) / 2 * VH]; };
const layerPoint = (key, u, v) => { // UV on a layer → world point
  const m = meshes[key], s = (D - m.userData.z) / D;
  return new THREE.Vector3((u - .5) * PW * s, (.5 - v) * PH * s, m.userData.z);
};

if (shot === 1) {
  camera.position.set(0, 0, D); camera.lookAt(0, 0, 0);
  if (!mobile) camera.setViewOffset(VW, VH, -VW * .1, 0, VW, VH); // nudge the invite right of the words
}
if (shot === 2) {
  if (mobile) { orbit(-46, 10, 36, new THREE.Vector3(.4, -2.6, -.5)); }
  else { orbit(-58, 13, 25, new THREE.Vector3(0, .3, 0)); camera.setViewOffset(VW, VH, -VW * .16, 0, VW, VH); }
}
if (shot === 3) {
  orbit(-148, 14, 21, new THREE.Vector3(-1.4, -.3, -3));
  if (!mobile) camera.setViewOffset(VW, VH, -VW * .18, 0, VW, VH);
  for (const m of Object.values(meshes)) if (m !== meshes.notes && !m.userData.additive) { m.material.opacity = .55; m.material.depthWrite = false; }
  // Gold threads: each note reaches through the stack to the layer it became.
  const threadMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(2.2, 1.7, 1.0) });
  NOTES.forEach(([, key, [u, v]], i) => {
    const from = meshes.notes.localToWorld(new THREE.Vector3((120 / 1100 - .5) * 3.3, (.5 - (292 + i * 216) / 1400) * 4.2, .02));
    const to = layerPoint(key, u, v);
    const mid = from.clone().lerp(to, .5).add(new THREE.Vector3(0, .6 + i * .15, 0));
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(from, mid, to), 80, .012, 6), threadMat));
    for (const p of [from, to]) { const k = new THREE.Mesh(new THREE.SphereGeometry(.05, 16, 16), threadMat); k.position.copy(p); scene.add(k); }
  });
}
if (shot === 4) {
  // The layers have locked onto the phone's screen; the film plays and a reply arrives.
  for (const m of Object.values(meshes)) m.visible = false;
  const [sc, sg] = canvas(1000, 2100);
  sg.fillStyle = '#101814'; sg.fillRect(0, 0, 1000, 2100);
  sg.fillStyle = '#18221d'; sg.fillRect(0, 0, 1000, 190);
  sg.fillStyle = '#C9A56B'; sg.beginPath(); sg.arc(110, 120, 46, 0, 7); sg.fill();
  sg.fillStyle = '#101814'; sg.font = '40px "Gilda Display"'; sg.textAlign = 'center'; sg.fillText('N', 110, 134); sg.textAlign = 'left';
  sg.fillStyle = '#F2E9E1'; sg.font = '400 40px Jost'; sg.fillText('Nani ji', 180, 112); sg.fillStyle = '#A08C7D'; sg.font = '300 28px Jost'; sg.fillText('online', 180, 152);
  // outgoing video message: the composed invite
  sg.fillStyle = '#2a3b33'; sg.beginPath(); sg.roundRect(300, 240, 640, 1130, 30); sg.fill();
  sg.save(); sg.beginPath(); sg.roundRect(318, 258, 604, 1074, 22); sg.clip();
  for (const L of layers) sg.drawImage(L.c, 318, 258, 604, 1074); sg.restore();
  sg.fillStyle = '#E6CFC6'; sg.font = '300 26px Jost'; sg.fillText('0:42', 340, 1310);
  // incoming
  sg.fillStyle = '#26302b'; sg.beginPath(); sg.roundRect(60, 1430, 560, 120, 30); sg.fill();
  sg.fillStyle = '#F2E9E1'; sg.font = '400 42px Jost'; sg.fillText('Beta, who made this?', 96, 1505);
  sg.fillStyle = '#26302b'; sg.beginPath(); sg.roundRect(60, 1570, 470, 120, 30); sg.fill();
  sg.fillStyle = '#F2E9E1'; sg.fillText('I watched it twice.', 96, 1645);
  // outgoing reply with emblem
  sg.fillStyle = '#5C1A1B'; sg.beginPath(); sg.roundRect(450, 1730, 490, 130, 30); sg.fill();
  sg.drawImage(emblem, 478, 1752, 90, 85);
  sg.fillStyle = '#F2E9E1'; sg.font = '400 30px "Gilda Display"'; sg.letterSpacing = '5px'; sg.fillText('AAMANTRAN', 588, 1795); sg.font = '300 22px Jost'; sg.fillStyle = '#C9A56B'; sg.fillText('· ATELIER ·', 600, 1832);
  sg.letterSpacing = '0px'; sg.fillStyle = '#18221d'; sg.fillRect(0, 1940, 1000, 160); sg.fillStyle = '#26302b'; sg.beginPath(); sg.roundRect(40, 1975, 920, 90, 45); sg.fill();
  const phone = new THREE.Mesh(new RoundedBoxGeometry(2.2, 4.48, .18, 8, .22), new THREE.MeshStandardMaterial({ color: '#16110f', metalness: .8, roughness: .3 }));
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(2.04, 4.28), new THREE.MeshBasicMaterial({ map: tex(sc) }));
  screen.position.z = .095; phone.add(screen); scene.add(phone);
  phone.rotation.set(-.04, -.22, .02);
  scene.add(new THREE.DirectionalLight('#ffd7a8', 3).translateX(-3).translateY(3).translateZ(4));
  camera.position.set(0, 0, 12.5); camera.lookAt(0, 0, 0);
  if (!mobile) camera.setViewOffset(VW, VH, -VW * .14, 0, VW, VH);
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(VW, VH), .45, .5, shot === 3 ? .9 : .7));
composer.addPass(new OutputPass());
composer.render();

// Layer labels for the orbit shot.
if (shot === 2) {
  const pick = mobile ? ['arch', 'florals', 'names'] : ['sky', 'arch', 'frame', 'florals', 'music', 'names', 'gold', 'dust'];
  for (const key of pick) {
    const L = meshes[key].userData, [x, y] = toScreen(layerPoint(key, 0, 0).add(new THREE.Vector3(0, .12, 0)));
    const t = document.createElement('div'); t.className = 'tag'; t.innerHTML = `${L.label}<span>${L.note}</span>`;
    t.style.left = x + 'px'; t.style.top = (y - 30) + 'px'; stage.appendChild(t);
  }
}
window.__ready = true;
</script></body></html>
