<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Mehendi Mein Naam — frame</title>
<link rel="stylesheet" href="../assets/frame.css">
<style>
  body{background:#E9CDB9}
  .skin{position:absolute;inset:0;background:
    radial-gradient(ellipse 70% 80% at 62% 45%, #F2DCCB 0%, #E7C6B0 55%, #CFA48C 100%)}
  .line.dark{color:var(--ink)}
  .line.dark .kicker{color:var(--cocoa);opacity:1}
  .slate.dark{color:rgba(43,31,26,.55)} .slate.dark b{color:rgba(43,31,26,.85)}
</style></head>
<body><div class="stage">
  <div class="skin"></div>
  <svg class="full" id="art" viewBox="0 0 1600 900"></svg>
  <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(236,208,190,.92) 0%,rgba(236,208,190,.6) 30%,rgba(236,208,190,0) 48%)"></div>
  <div class="grain" style="opacity:.14"></div>
  <div class="vignette" style="background:radial-gradient(ellipse at 60% 50%,transparent 50%,rgba(90,50,30,.35) 100%)"></div>
  <div class="line dark" style="left:96px;right:auto;top:auto;bottom:120px;width:460px;text-align:left">
    <div class="kicker" style="padding-left:0">Mehendi mein naam</div>
    <div class="say">Every wedding hides a story.<br><em>We find it.</em></div>
  </div>
  <div class="slate dark"><b>03 · Mehendi Mein Naam</b> &nbsp;—&nbsp; shot 8 · the hidden names, found</div>
  <div class="scrub" style="background:rgba(43,31,26,.2)"><i style="width:88%;background:var(--gold-deep)"></i></div>
</div>
<script type="module">
await document.fonts.load('40px "Pinyon Script"');
const NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('art');
const el = (tag, attrs, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const P = (a, r) => [Math.cos(a) * r, Math.sin(a) * r];
const f = n => n.toFixed(1);

// Hand-drawn wobble + the slight raised edge of dried paste.
const defs = el('defs', {});
defs.innerHTML = `
  <filter id="hand" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
    <feDropShadow dx=".6" dy=".9" stdDeviation=".5" flood-color="#3a1206" flood-opacity=".45"/>
  </filter>
  <radialGradient id="glint" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#FFF0C8" stop-opacity="1"/><stop offset=".35" stop-color="#E8C27A" stop-opacity=".45"/><stop offset="1" stop-color="#E8C27A" stop-opacity="0"/>
  </radialGradient>
  <path id="nameRing" d="M -232 0 A 232 232 0 1 1 232 0 A 232 232 0 1 1 -232 0"/>`;

const CX = 990, CY = 450, ink = '#6B2A12', inkDeep = '#4A1A0A';
const g = el('g', { transform: `translate(${CX} ${CY}) rotate(-58)`, fill: 'none', stroke: ink, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', filter: 'url(#hand)' });
const ring = (r, w = 2.2) => el('circle', { r, 'stroke-width': w }, g);
const dots = (r, n, s, fill = ink) => { for (let i = 0; i < n; i++) { const [x, y] = P(i / n * Math.PI * 2, r); el('circle', { cx: f(x), cy: f(y), r: s, fill, stroke: 'none' }, g); } };
function petals(r0, r1, n, w, opts = {}) {
  for (let i = 0; i < n; i++) {
    const a = (i + (opts.offset || 0)) / n * Math.PI * 2, da = w / n * Math.PI;
    const [x0, y0] = P(a, r0), [x1, y1] = P(a, r1), [ca, cb] = [P(a - da, (r0 + r1) / 2 * 1.05), P(a + da, (r0 + r1) / 2 * 1.05)];
    el('path', { d: `M${f(x0)} ${f(y0)} Q${f(ca[0])} ${f(ca[1])} ${f(x1)} ${f(y1)} Q${f(cb[0])} ${f(cb[1])} ${f(x0)} ${f(y0)}`, 'stroke-width': opts.sw || 2.4, fill: opts.fill || 'none' }, g);
    if (opts.vein) el('path', { d: `M${f(x0)} ${f(y0)} L${f(P(a, r0 + (r1 - r0) * .8)[0])} ${f(P(a, r0 + (r1 - r0) * .8)[1])}`, 'stroke-width': 1.4 }, g);
    if (opts.inner) { // nested outline
      const [ia, ib] = [P(a - da * .55, (r0 + r1) / 2), P(a + da * .55, (r0 + r1) / 2)], [ix1, iy1] = P(a, r1 - (r1 - r0) * .2), [ix0, iy0] = P(a, r0 + (r1 - r0) * .12);
      el('path', { d: `M${f(ix0)} ${f(iy0)} Q${f(ia[0])} ${f(ia[1])} ${f(ix1)} ${f(iy1)} Q${f(ib[0])} ${f(ib[1])} ${f(ix0)} ${f(iy0)}`, 'stroke-width': 1.3 }, g);
    }
    if (opts.tipDot) { const [tx, ty] = P(a, r1 + 9); el('circle', { cx: f(tx), cy: f(ty), r: 3.2, fill: ink, stroke: 'none' }, g); }
  }
}
function jaal(r0, r1, n) { // crosshatched net band
  for (let i = 0; i < n; i++) {
    const a0 = i / n * Math.PI * 2, a1 = (i + 3) / n * Math.PI * 2;
    for (const [p, q] of [[P(a0, r0), P(a1, r1)], [P(a1, r0), P(a0, r1)]]) el('line', { x1: f(p[0]), y1: f(p[1]), x2: f(q[0]), y2: f(q[1]), 'stroke-width': 1.1 }, g);
  }
}
function scallops(r, n, depth, sw = 2) {
  let d = '';
  for (let i = 0; i < n; i++) {
    const a0 = i / n * Math.PI * 2, a1 = (i + 1) / n * Math.PI * 2, am = (a0 + a1) / 2;
    const [x0, y0] = P(a0, r), [x1, y1] = P(a1, r), [cx, cy] = P(am, r + depth);
    d += `${i ? '' : `M${f(x0)} ${f(y0)}`} Q${f(cx)} ${f(cy)} ${f(x1)} ${f(y1)} `;
  }
  el('path', { d, 'stroke-width': sw }, g);
}
function paisleys(r, n, s) {
  for (let i = 0; i < n; i++) {
    const a = (i + .5) / n * Math.PI * 2, [x, y] = P(a, r);
    const k = el('g', { transform: `translate(${f(x)} ${f(y)}) rotate(${f(a * 180 / Math.PI + 90)}) scale(${s})` }, g);
    el('path', { d: 'M0 34 C-26 30 -30 -6 -8 -20 C6 -30 22 -22 18 -6 C14 10 -2 6 2 -6', 'stroke-width': 2.4 / s }, k);
    el('path', { d: 'M0 26 C-17 22 -20 -2 -6 -12 C2 -18 12 -12 10 -4', 'stroke-width': 1.2 / s }, k);
    el('circle', { cx: 5, cy: -6, r: 3, fill: ink, stroke: 'none' }, k);
    for (let j = 0; j < 5; j++) el('circle', { cx: -10 + j * 2, cy: 4 + j * 5, r: 1.4, fill: ink, stroke: 'none' }, k);
  }
}

// --- Build the mandala from the centre out ---
el('circle', { r: 26, fill: ink, stroke: 'none' }, g);
ring(36); dots(46, 24, 2.6);
petals(54, 104, 12, .9, { fill: ink, tipDot: true });
ring(122, 2.6); scallops(126, 32, 10); dots(146, 40, 2.4);
ring(156, 1.6); jaal(160, 196, 72); ring(200, 1.6);
// The band that carries the hidden names.
ring(214, 2.4); ring(252, 2.4);
petals(260, 340, 16, .85, { inner: true, vein: true });
petals(268, 320, 16, .55, { offset: .5, sw: 1.6, fill: inkDeep });
paisleys(370, 16, 1.05);
ring(408, 2.8); scallops(412, 48, 16, 2.4); dots(444, 64, 3);
petals(452, 560, 24, .8, { inner: true, tipDot: true });
ring(590, 1.8); jaal(594, 640, 120); ring(644, 1.8);
petals(650, 760, 32, .75, { inner: true });
dots(780, 96, 3.4);

// Hidden names on the ring path, in the same ink: only the light finds them.
const t = el('text', { 'font-family': 'Pinyon Script', 'font-size': 34, fill: ink, stroke: 'none', 'letter-spacing': 1 }, g);
const tp = el('textPath', { href: '#nameRing', startOffset: '0' }, t);
const motif = '  ·  ';
tp.textContent = Array(6).fill('').map((_, i) => i === 4 ? 'Ananya & Kabir' : '~ ° ~ ° ~ ° ~').join(motif);

// Glint: a warm light passing over the names.
const nameIdx = tp.textContent.indexOf('Ananya') + 7;
const nameSpan = tp.textContent;
const sp = t.getStartPositionOfChar(nameIdx), m = g.getCTM();
const gx = sp.x * m.a + sp.y * m.c + m.e - CX, gy = sp.x * m.b + sp.y * m.d + m.f - CY;
const glintAngle = Math.atan2(gy, gx);
el('ellipse', { cx: f(CX + gx), cy: f(CY + gy), rx: 230, ry: 120, fill: 'url(#glint)', transform: `rotate(${f(glintAngle * 180 / Math.PI + 90)} ${f(CX + gx)} ${f(CY + gy)})`, style: 'mix-blend-mode:screen' });
for (const [dx, dy, s] of [[-40, -18, 1], [52, 14, .7], [8, -42, .55]]) {
  const x = CX + gx + dx, y = CY + gy + dy;
  el('path', { d: `M${x} ${y - 14 * s} L${x + 2.2 * s} ${y} L${x} ${y + 14 * s} L${x - 2.2 * s} ${y} Z M${x - 14 * s} ${y} L${x} ${y + 2.2 * s} L${x + 14 * s} ${y} L${x} ${y - 2.2 * s} Z`, fill: '#FFF3D6' });
}
window.__glint = [CX + gx, CY + gy];
window.__ready = true;
</script></body></html>
