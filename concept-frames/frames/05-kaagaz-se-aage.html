<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Kaagaz Se Aage — frame</title>
<link rel="stylesheet" href="../assets/frame.css">
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script>
</head>
<body><div class="stage">
  <canvas id="c"></canvas>
  <div class="vignette"></div><div class="grain"></div>
  <div class="line" style="top:auto;bottom:96px">
    <div class="kicker">For generations, invitations held still.</div>
    <div class="title" style="margin-top:22px;font-size:54px">Ours move.</div>
  </div>
  <div class="slate"><b>05 · Kaagaz Se Aage</b> &nbsp;—&nbsp; shot 3 · the gold foil lifts off the card</div>
  <div class="scrub"><i style="width:31%"></i></div>
</div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { C, canvas, rng, filigree } from '../assets/art.js';

await document.fonts.load('60px "Tiro Devanagari Hindi"'); await document.fonts.load('60px "Gilda Display"'); await document.fonts.load('300 30px Jost');
const r = rng(31);

function paperNoise(g, w, h, a = .05) {
  for (let i = 0; i < w * h / 40; i++) { g.fillStyle = `rgba(80,50,30,${r() * a})`; g.fillRect(r() * w, r() * h, 1.5, 1.5); }
}
// A traditional printed card. `foil` false draws the gold areas as bare impressions (the foil has lifted).
function printedCard({ ground = '#F1E6D2', border = C.maroon, foil = true, title = 'शुभ विवाह', names = 'ANANYA  ·  KABIR' } = {}) {
  const W = 1000, H = 1400, [c, g] = canvas(W, H);
  g.fillStyle = ground; g.fillRect(0, 0, W, H); paperNoise(g, W, H);
  g.strokeStyle = border; g.lineWidth = 14; g.strokeRect(50, 50, W - 100, H - 100);
  g.lineWidth = 3; g.strokeRect(84, 84, W - 168, H - 168);
  const gold = foil ? C.gold : 'rgba(150,120,80,.28)';
  filigree(g, W, H, 110, gold);
  // Paisley medallion
  g.save(); g.translate(W / 2, H * .3); g.strokeStyle = gold; g.fillStyle = gold; g.lineWidth = 6;
  for (let i = 0; i < 8; i++) { g.rotate(Math.PI / 4); g.beginPath(); g.ellipse(0, -95, 26, 70, 0, 0, 7); g.stroke(); g.beginPath(); g.arc(0, -150, 9, 0, 7); g.fill(); }
  g.beginPath(); g.arc(0, 0, 40, 0, 7); g.stroke(); g.beginPath(); g.arc(0, 0, 14, 0, 7); g.fill(); g.restore();
  g.textAlign = 'center'; g.fillStyle = border;
  g.font = '30px "Tiro Devanagari Hindi"'; g.fillText('॥ श्री गणेशाय नमः ॥', W / 2, 190);
  g.font = '92px "Tiro Devanagari Hindi"'; g.fillStyle = foil ? border : 'rgba(92,26,27,.55)'; g.fillText(title, W / 2, H * .58);
  g.fillStyle = border; g.font = '52px "Gilda Display"'; g.letterSpacing = '10px'; g.fillText(names, W / 2, H * .68);
  g.font = '300 28px Jost'; g.letterSpacing = '8px'; g.fillStyle = C.cocoa; g.fillText('14 · 02 · 2027  ·  JAIPUR', W / 2, H * .75);
  return c;
}
function texture(c) { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; return t; }

// --- Renderer & scene ---
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(1600, 900, false); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .95;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#0c0806');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture; scene.environmentIntensity = .12;
const camera = new THREE.PerspectiveCamera(30, 16 / 9, .1, 100);
camera.position.set(.4, 8.4, 6.6); camera.lookAt(0, .3, .1);

// Table: dark sheesham wood.
const [wc, wg] = canvas(2048, 2048);
wg.fillStyle = '#2a1810'; wg.fillRect(0, 0, 2048, 2048);
for (let i = 0; i < 900; i++) { const y = r() * 2048; wg.strokeStyle = `rgba(${r() > .5 ? '70,40,22' : '18,10,6'},${.2 + r() * .4})`; wg.lineWidth = .5 + r() * 2.5; wg.beginPath(); wg.moveTo(0, y); for (let x = 0; x <= 2048; x += 64) wg.lineTo(x, y + Math.sin(x * .004 + i) * 10 + (r() - .5) * 3); wg.stroke(); }
const table = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ map: texture(wc), roughness: .55, metalness: 0 }));
table.rotation.x = -Math.PI / 2; table.receiveShadow = true; scene.add(table);

function card(tex, w, h, pos, rotY, lift = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, .025, h), [
    new THREE.MeshStandardMaterial({ color: '#e9dcc4' }), new THREE.MeshStandardMaterial({ color: '#e9dcc4' }),
    new THREE.MeshStandardMaterial({ map: tex, roughness: .8 }), new THREE.MeshStandardMaterial({ color: '#d8c8ae' }),
    new THREE.MeshStandardMaterial({ color: '#e9dcc4' }), new THREE.MeshStandardMaterial({ color: '#e9dcc4' })]);
  m.position.set(pos[0], .0125 + lift, pos[1]); m.rotation.y = rotY; m.castShadow = m.receiveShadow = true; scene.add(m); return m;
}
// Stack of other families' cards around the edges.
card(texture(printedCard({ ground: '#E9C9A0', border: '#7A1F26', title: 'शुभ लग्न', names: 'MEERA  ·  ARJUN' })), 2.1, 2.94, [-3.3, -.4], .28);
card(texture(printedCard({ ground: '#F4EEDF', border: C.green, title: 'मंगल परिणय', names: 'RIYA  ·  KARAN' })), 2.1, 2.94, [3.4, -.2], -.22);
card(texture(printedCard({ ground: '#F0D8C8', border: '#5A4636', title: 'विवाह', names: 'NAINA  ·  DEV' })), 2.1, 2.94, [3.0, .35], -.05, .03);
// Envelope (maroon) under the hero card.
const env = new THREE.Mesh(new RoundedBoxGeometry(2.6, .03, 3.4, 2, .02), new THREE.MeshStandardMaterial({ color: '#5C1A1B', roughness: .7 }));
env.position.set(.25, .015, .1); env.rotation.y = .12; env.castShadow = env.receiveShadow = true; scene.add(env);
// Mithai box corner
const box = new THREE.Mesh(new THREE.BoxGeometry(2.4, .7, 2.4), new THREE.MeshStandardMaterial({ color: '#8a1d22', roughness: .45 }));
box.position.set(-3.6, .35, 2.6); box.rotation.y = .5; box.castShadow = true; scene.add(box);
const ribbon = new THREE.Mesh(new THREE.BoxGeometry(2.42, .71, .2), new THREE.MeshStandardMaterial({ color: C.gold, metalness: 1, roughness: .3 }));
ribbon.position.copy(box.position); ribbon.rotation.y = .5; scene.add(ribbon);

// Hero card: the foil has started lifting, so its printed gold is now only an impression.
const hero = card(texture(printedCard({ foil: false })), 2.0, 2.8, [0, .3], .04, .03);

// --- The gold foil, lifting off as ribbons ---
const goldMat = new THREE.MeshStandardMaterial({ color: '#d9b06a', metalness: 1, roughness: .22, emissive: '#7a5214', emissiveIntensity: .9 });
const cardTop = .07, W = 2.0, H = 2.8;
function toWorld(u, v, y) { // card-local UV (0..1) → world, honouring card rotation
  const p = new THREE.Vector3((u - .5) * W, y, (v - .5) * H); p.applyAxisAngle(new THREE.Vector3(0, 1, 0), .04); return p.add(new THREE.Vector3(0, 0, .3));
}
const borderPts = [];
for (let i = 0; i < 40; i++) { const t = i / 40; borderPts.push([.11 + t * .78, .08]); }
for (let s = 0; s < 11; s++) {
  // each strand starts at the filigree rule and curls upward toward camera
  const [u0, v0] = s < 10 ? [.12 + s * .085, .08 + (s % 2) * .015] : [.08 + (s % 2) * .02, .15 + (s - 10) * .09];
  const pts = [], height = .6 + r() * 1.2, twist = (r() - .5) * 2.2, lean = new THREE.Vector3((r() - .5) * .9, 0, -.3 - r() * .5);
  const turns = 1.1 + r() * .5, base = toWorld(u0, v0, cardTop);
  for (let k = 0; k <= 30; k++) {
    const t = k / 30, a = t * Math.PI * turns + twist;
    pts.push(base.clone().add(new THREE.Vector3(Math.sin(a) * .32 * t + lean.x * t, Math.pow(t, 1.3) * height, Math.cos(a) * .26 * t + lean.z * t * t)));
  }
  const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 80, .007 + r() * .006, 6), goldMat);
  m.castShadow = true; scene.add(m);
}
// The medallion's petals peeling up as flat gold leaves.
for (let i = 0; i < 8; i++) {
  const a = i / 8 * Math.PI * 2, leaf = new THREE.Mesh(new THREE.CircleGeometry(.1, 24), goldMat);
  leaf.scale.set(.45, 1, 1);
  const p = toWorld(.5 + Math.sin(a) * .1, .3 - Math.cos(a) * .07, cardTop + .35 + i * .16);
  leaf.position.x += Math.sin(a) * .25;
  leaf.position.copy(p); leaf.rotation.set(-1 + r() * .8, a, r()); scene.add(leaf);
}
// Ink lifting off: Devanagari letters rising as soft dark flakes.
const glyphs = 'शुभविवाहमंगल';
for (let i = 0; i < 14; i++) {
  const [gc, gg] = canvas(128, 128); gg.font = '84px "Tiro Devanagari Hindi"'; gg.textAlign = 'center'; gg.fillStyle = '#7A1F26'; gg.fillText(glyphs[i % glyphs.length], 64, 96);
  const s = new THREE.Mesh(new THREE.PlaneGeometry(.3, .3), new THREE.MeshBasicMaterial({ map: texture(gc), transparent: true, side: THREE.DoubleSide, opacity: .55 + r() * .4 }));
  s.position.copy(toWorld(.3 + r() * .4, .55 + (r() - .5) * .06, cardTop + .2 + r() * 1.8)); s.rotation.set(-1.1 + (r() - .5), (r() - .5) * .8, (r() - .5)); scene.add(s);
}
// Gold dust rising
const dg = new THREE.BufferGeometry(), dp = [];
for (let i = 0; i < 1600; i++) { const p = toWorld(r(), r() * .6, cardTop + Math.pow(r(), 1.8) * 2.6); dp.push(p.x + (r() - .5) * .5, p.y, p.z + (r() - .5) * .5); }
dg.setAttribute('position', new THREE.Float32BufferAttribute(dp, 3));
scene.add(new THREE.Points(dg, new THREE.PointsMaterial({ color: '#ffd98f', size: .02, transparent: true, opacity: .85, blending: THREE.AdditiveBlending })));

// --- Lamp light ---
scene.add(new THREE.AmbientLight('#ffe2c4', .12));
const lamp = new THREE.SpotLight('#ffc98a', 46, 22, .55, .85, 1.4); lamp.position.set(-2.4, 7.5, -1.2); lamp.target.position.set(0, 0, .5);
lamp.castShadow = true; lamp.shadow.mapSize.set(2048, 2048); lamp.shadow.bias = -.0004; lamp.shadow.radius = 6; scene.add(lamp, lamp.target);
const glow = new THREE.PointLight('#ffb35c', 1.2, 4); glow.position.set(0, 1.2, .2); scene.add(glow);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new BokehPass(scene, camera, { focus: 10.4, aperture: .0022, maxblur: .008 }));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1600, 900), .6, .4, .82));
composer.addPass(new OutputPass());
composer.render();
window.__ready = true;
</script></body></html>
