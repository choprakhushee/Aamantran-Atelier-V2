// ---------------------------------------------------------------------------

const field = (v, ph, go = 'Continue') => `<div class="field"><div class="v ${v ? '' : 'ph'}">${v || ph}<span class="caret"></span></div><div class="go">${go} →</div></div>`;

// ---------------------------------------------------------------------------
// Paper, envelope and card artwork (canvas textures).
// ---------------------------------------------------------------------------
const r = rng(19);
function paper(g, w, h, base, fleck = 'rgba(60,30,20,', a = .07) {
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < w * h / 26; i++) { g.fillStyle = fleck + (r() * a) + ')'; g.fillRect(r() * w, r() * h, 1 + r() * 1.5, 1 + r() * 1.5); }
  for (let i = 0; i < 60; i++) { g.strokeStyle = fleck + (r() * a * .8) + ')'; g.lineWidth = .6; g.beginPath(); const x = r() * w, y = r() * h; g.moveTo(x, y); g.lineTo(x + (r() - .5) * 40, y + (r() - .5) * 40); g.stroke(); }
}
const tex = c => { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; return t; };

const EW = 3.4, EH = 2.3;               // envelope size (world units)
function envelopeFront({ to = '', from = '', blankTo = false } = {}) {
  const W = 1700, H = 1150, [c, g] = canvas(W, H);
  paper(g, W, H, '#5a1719', 'rgba(255,220,200,', .05);
  g.strokeStyle = 'rgba(201,165,107,.55)'; g.lineWidth = 3; g.strokeRect(40, 40, W - 80, H - 80);
  g.lineWidth = 1.2; g.strokeRect(56, 56, W - 112, H - 112);
  g.textAlign = 'center'; g.fillStyle = '#C9A56B';
  if (from) { g.font = '300 30px Jost'; g.letterSpacing = '8px'; g.textAlign = 'left'; g.fillText('FROM', 110, 800); g.font = '64px "Pinyon Script"'; g.letterSpacing = '0px'; g.fillText(from, 110, 880); g.textAlign = 'center'; }
  g.font = '300 34px Jost'; g.letterSpacing = '10px'; g.fillText(from ? 'TO' : 'FOR', W / 2 + (from ? 120 : 0), 770);
  g.letterSpacing = '0px';
  if (to) { g.font = '170px "Pinyon Script"'; g.fillText(to, W / 2 + (from ? 120 : 0), 950); }
  if (!to || blankTo) { g.setLineDash([3, 14]); g.strokeStyle = 'rgba(201,165,107,.8)'; g.lineWidth = 3; g.beginPath(); g.moveTo(W / 2 - 330 + (from ? 120 : 0), 930); g.lineTo(W / 2 + 330 + (from ? 120 : 0), 930); g.stroke(); g.setLineDash([]); }
  return c;
}
function flapTexture() {
  const W = 1700, H = 800, [c, g] = canvas(W, H);
  paper(g, W, H, '#4e1416', 'rgba(255,220,200,', .05);
  return c;
}
function flapLining() { // inside of the flap: the harlequin, seen when it opens

}

}

// The card inside. `mode`: 'pleasure' (the invitation to the visitor) or 'theirs' (their wedding invite).
const CW = 2.7, CH = 3.8;
function cardFace(mode, partialPartner) {
  const W = 1080, H = 1520, [c, g] = canvas(W, H);
  paper(g, W, H, '#F2E9E1');
  g.strokeStyle = C.goldDeep; g.lineWidth = 3; g.strokeRect(54, 54, W - 108, H - 108); g.lineWidth = 1.2; g.strokeRect(70, 70, W - 140, H - 140);

    g.fillStyle = C.maroon; g.font = '38px "Gilda Display"'; g.letterSpacing = '12px'; g.fillText('AAMANTRAN ATELIER', W / 2 + 6, 400);
    g.font = '300 38px Jost'; g.letterSpacing = '1px'; g.fillStyle = C.ink;
    g.fillText('requests the pleasure', W / 2, 540); g.fillText('of your company,', W / 2, 594);
    g.font = '190px "Pinyon Script"'; g.fillStyle = C.maroon; g.letterSpacing = '0px'; g.fillText(YOU.name, W / 2, 800);
    g.font = '300 38px Jost'; g.fillStyle = C.ink; g.fillText('at the first scene of', W / 2, 930);
    g.font = '64px "Gilda Display"'; g.letterSpacing = '14px'; g.fillStyle = C.maroon; g.fillText('YOUR WEDDING', W / 2 + 7, 1030);
    g.letterSpacing = '0px'; g.font = '300 26px Jost'; g.letterSpacing = '6px'; g.fillStyle = C.goldDeep; g.fillText('R · S · V · P   BELOW', W / 2, 1290);
  } else {

    g.font = '300 32px Jost'; g.fillStyle = C.ink; g.letterSpacing = '2px'; g.fillText('together with their families', W / 2, 410);
    g.letterSpacing = '0px'; g.fillStyle = C.maroon; g.font = '170px "Pinyon Script"'; g.fillText(YOU.name, W / 2, 610);
    g.fillStyle = C.goldDeep; g.font = '120px "Pinyon Script"'; g.fillText('&', W / 2, 740);
    const p = partialPartner ?? YOU.partner; g.fillStyle = C.maroon; g.font = '170px "Pinyon Script"'; g.fillText(p, W / 2, 900);
    if (partialPartner != null) { const w = g.measureText(p).width; g.fillStyle = C.gold; g.fillRect(W / 2 + w / 2 + 12, 790, 4, 130); }
    g.font = '300 32px Jost'; g.fillStyle = C.ink; g.letterSpacing = '2px'; g.fillText('invite you to celebrate their wedding', W / 2, 1020);
    g.font = '400 40px Jost'; g.letterSpacing = '12px'; g.fillStyle = C.maroon; g.fillText(YOU.dateText, W / 2 + 6, 1150);
    g.font = '300 28px Jost'; g.letterSpacing = '10px'; g.fillStyle = C.goldDeep; g.fillText(YOU.city.toUpperCase(), W / 2 + 5, 1215);
  }

}

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(VW, VH, false); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#120a08');
const camera = new THREE.PerspectiveCamera(30, aspect, .05, 200);

// Velvet table with a pool of lamplight.
{
  const [c, g] = canvas(1024, 1024);
  const grd = g.createRadialGradient(512, 512, 30, 512, 512, 520); grd.addColorStop(0, '#3a1615'); grd.addColorStop(1, '#140a09');
  g.fillStyle = grd; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 40000; i++) { g.fillStyle = `rgba(0,0,0,${r() * .18})`; g.fillRect(r() * 1024, r() * 1024, 1, 1); }
  const table = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ map: tex(c), roughness: .95 }));
  table.rotation.x = -Math.PI / 2; table.position.y = -.02; table.receiveShadow = true; scene.add(table); scene.userData.table = table;
}
scene.add(new THREE.HemisphereLight('#ffe7cf', '#2a1210', .35));
const lamp = new THREE.SpotLight('#ffd3a0', 58, 30, .5, .8, 1.3); lamp.position.set(-2.5, 9, 3); lamp.castShadow = true; lamp.shadow.mapSize.set(2048, 2048); lamp.shadow.radius = 8; lamp.shadow.bias = -.0005;
scene.add(lamp, lamp.target);
const rim = new THREE.PointLight('#ff9d5c', 8, 12); rim.position.set(3, 2, -3); scene.add(rim);

// Envelope: body, hinged flap, wax seal.
function makeEnvelope(opts, flapOpen = 0, sealState = 'whole') {
  const env = new THREE.Group();
  const paperMat = new THREE.MeshStandardMaterial({ color: '#4a1315', roughness: .85 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(EW, .03, EH), [paperMat, paperMat, new THREE.MeshStandardMaterial({ map: tex(envelopeFront(opts)), roughness: .8 }), paperMat, paperMat, paperMat]);
  body.castShadow = body.receiveShadow = true; env.add(body);
  // Flap: a triangle hinged on the top edge.
  const fh = EH * .52, shape = new THREE.Shape(); shape.moveTo(-EW / 2, 0); shape.lineTo(EW / 2, 0); shape.quadraticCurveTo(EW * .06, -fh * .95, 0, -fh); shape.quadraticCurveTo(-EW * .06, -fh * .95, -EW / 2, 0);
  const fg = new THREE.ShapeGeometry(shape, 24), uv = fg.attributes.uv, pos = fg.attributes.position;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, pos.getX(i) / EW + .5, 1 + pos.getY(i) / fh);
  const hinge = new THREE.Group(); hinge.position.set(0, .018, -EH / 2); env.add(hinge);
  const flapOut = new THREE.Mesh(fg, new THREE.MeshStandardMaterial({ map: tex(flapTexture()), roughness: .8, side: THREE.FrontSide }));
  const flapIn = new THREE.Mesh(fg, new THREE.MeshStandardMaterial({ map: tex(flapLining()), roughness: .8, side: THREE.BackSide }));
  for (const f of [flapOut, flapIn]) { f.rotation.x = -Math.PI / 2; f.castShadow = true; hinge.add(f); }
  // closed: flap lies on the body pointing toward the viewer
  hinge.rotation.x = Math.PI - flapOpen * (Math.PI * .92);
  hinge.children.forEach(f => { f.rotation.x = Math.PI / 2; f.position.y = -.004; });
  // Wax seal at the flap tip.
  if (sealState !== 'none') {
    const sealGeo = new THREE.CylinderGeometry(.27, .29, .06, 48, 1); const sp = sealGeo.attributes.position;
    for (let i = 0; i < sp.count; i++) { const x = sp.getX(i), z = sp.getZ(i), a = Math.atan2(z, x), k = 1 + Math.sin(a * 7) * .04 + Math.sin(a * 13 + 1) * .03; sp.setX(i, x * k); sp.setZ(i, z * k); }
    sealGeo.computeVertexNormals();
    const sm = new THREE.MeshStandardMaterial({ color: '#1F3A2E', roughness: .35, metalness: .1 });
    const face = new THREE.Mesh(new THREE.CircleGeometry(.25, 48), new THREE.MeshStandardMaterial({ map: tex(sealFace()), roughness: .3, metalness: .2 }));
    face.rotation.x = -Math.PI / 2; face.position.y = .031;
    if (sealState === 'whole') {
      const s = new THREE.Group(), cyl = new THREE.Mesh(sealGeo, sm); cyl.castShadow = true; s.add(cyl, face);
      s.position.set(0, .07, -EH / 2 + fh * .92); env.add(s);
    } else { // broken: two half-discs pushed apart
      for (const side of [-1, 1]) {
        const t0 = side < 0 ? Math.PI / 2 : -Math.PI / 2;
        const half = new THREE.Group();
        const cyl = new THREE.Mesh(new THREE.CylinderGeometry(.27, .29, .06, 32, 1, false, t0, Math.PI), sm);
        const cut = new THREE.Mesh(new THREE.BoxGeometry(.004, .06, .56), sm);
        const f = new THREE.Mesh(new THREE.CircleGeometry(.25, 32, side < 0 ? Math.PI / 2 : -Math.PI / 2, Math.PI), face.material);
        f.rotation.x = -Math.PI / 2; f.position.y = .031;
        cyl.castShadow = true; half.add(cyl, cut, f);
        half.position.set(side * .1, .05, -EH / 2 + fh * .92 + side * .03); half.rotation.set(0, side * .16, side * .1);
        env.add(half);
      }
      // crumbs of wax
      for (let i = 0; i < 9; i++) { const b = new THREE.Mesh(new THREE.DodecahedronGeometry(.02 + r() * .025, 0), sm); b.position.set((r() - .5) * .9, .04, -EH / 2 + fh * .92 + (r() - .5) * .5); b.castShadow = true; env.add(b); }
    }

}
function makeCard(mode, partial) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(CW, .02, CH), [
    ...Array(2).fill(new THREE.MeshStandardMaterial({ color: '#e9dfd2' })),
    new THREE.MeshStandardMaterial({ map: tex(cardFace(mode, partial)), roughness: .75 }),
    ...Array(3).fill(new THREE.MeshStandardMaterial({ color: '#e9dfd2' }))]);
  m.castShadow = m.receiveShadow = true; return m;
}
// Dust in the lamplight.
{
  const g = new THREE.BufferGeometry(), p = [];
  for (let i = 0; i < 1200; i++) p.push((r() - .5) * 14, r() * 6, (r() - .5) * 12);
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: '#ffdcae', size: .018, transparent: true, opacity: .55 })));
}

// Frame an object: camera above/in front, fitting a box of size (w, h) into the upper part of the view.
function frame(target, w, h, { elev = 62, azim = 0, fill = mobile ? .94 : .5, lift = mobile ? .17 : .1 } = {}) {
  const vfov = camera.fov * Math.PI / 180, hfov = 2 * Math.atan(Math.tan(vfov / 2) * aspect);
  const dist = Math.max((w / fill) / 2 / Math.tan(hfov / 2), (h / (mobile ? .52 : .5)) / 2 / Math.tan(vfov / 2));
  const e = elev * Math.PI / 180, a = azim * Math.PI / 180;
  camera.position.set(target.x + Math.sin(a) * Math.cos(e) * dist, target.y + Math.sin(e) * dist, target.z + Math.cos(a) * Math.cos(e) * dist);
  camera.lookAt(target);
  camera.setViewOffset(VW, VH, 0, VH * lift, VW, VH);   // push the subject up, above the words
}

let bloom = .35;
const stage = document.getElementById('stage');
const label = (v, html) => { const p = v.clone().project(camera), d = document.createElement('div'); d.className = 'label'; d.innerHTML = html; d.style.left = (p.x + 1) / 2 * VW + 'px'; d.style.top = (1 - p.y) / 2 * VH + 'px'; stage.appendChild(d); };

if (shot === 1 || shot === 2) {
  const env = makeEnvelope({ to: shot === 2 ? YOU.name : '' }, 0, shot === 1 ? 'whole' : 'broken');
  env.rotation.y = -.05; scene.add(env);
  frame(new THREE.Vector3(0, 0, .1), EW, EH, { elev: 64 });
}
if (shot === 3) {
  const env = makeEnvelope({ to: YOU.name }, 1.08, 'none'); env.rotation.y = -.06; env.position.z = 1.1; scene.add(env);
  const card = makeCard('pleasure'); card.position.set(.04, .09, -.55); card.rotation.set(0, -.04, 0); scene.add(card);
  // The pocket: the lower part of the envelope front, in front of the card.
  const ft = tex(envelopeFront({ to: YOU.name })); ft.repeat.set(1, .5); ft.offset.set(0, 0);
